const norm=s=>(s||'').trim().toLowerCase();
let pool=[],questions=[],idx=0,lives=5,shield=false,combo=0,maxCombo=0,score=0,correct=0,rankEligible=true,nick='',range='ALL',locked=false,timerId=null,timerDeadline=0;
const stages=[{name:'STAGE 1 · WARM UP',mode:'ENKO',pts:100,time:0},{name:'STAGE 2 · REVERSE',mode:'KOEN',pts:120,time:0},{name:'STAGE 3 · CONTEXT',mode:'CTX',pts:150,time:12},{name:'STAGE 4 · SURVIVAL',mode:'MIX',pts:180,time:8},{name:'☠️ FINAL BOSS',mode:'BOSS',pts:250,time:6}];
function uniquePool(group){let src=group==='ALL'?VOCAB_DB:VOCAB_DB.filter(x=>x.group===group),m=new Map();for(const x of src){let k=norm(x.word);if(!m.has(k))m.set(k,x)}return [...m.values()]}
function pickDistractors(item, field){let vals=pool.filter(x=>norm(x.word)!==norm(item.word)).map(x=>field==='meaning'?x.meaning:x.word).filter(Boolean);vals=[...new Set(vals.filter(x=>norm(x)!==norm(item[field])))];return shuffle(vals).slice(0,3)}
function exactContextMatch(item){
  const c=(item.context||'').trim();
  const raw=(item.word||'').trim();
  if(!c||!raw)return null;
  const w=raw.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
  // 타깃 앞뒤가 영문자이면 매치 금지: architect가 architecture/architects 일부를 가리는 문제 방지.
  const re=new RegExp('(^|[^A-Za-z])('+w+')(?=$|[^A-Za-z])','i');
  const m=re.exec(c);
  if(!m)return null;
  return {match:m,index:m.index+m[1].length,prefix:m[1],text:m[2],regex:re};
}
function isSafeContext(item){
  const c=(item.context||'').trim();
  if(!item.contextEligible||!c||c.length<90)return false;
  if(/[↳↱┏┻]/.test(c)||/관계대명사|명사적\(|분사구문/.test(c))return false;
  const hit=exactContextMatch(item);
  if(!hit)return false; // 완전한 단어/표현으로 존재할 때만 Context 출제
  const i=hit.index, len=hit.text.length;
  if(i<30||c.length-(i+len)<30)return false;
  if(i<c.length*0.05||i>c.length*0.78)return false;
  return true;
}
function blankContext(item){
  if(!isSafeContext(item))return '';
  const c=item.context.trim();
  const hit=exactContextMatch(item);
  if(!hit)return '';
  return c.slice(0,hit.index)+'________'+c.slice(hit.index+hit.text.length);
}
function buildQuestions(){
  pool=uniquePool(range); let used=new Set(),out=[];

    if(s===2||s===4) base=base.filter(isSafeContext);
    if(s===4){const hard=base.filter(x=>x.difficulty>=2);if(hard.length>=10)base=hard;}
    let eligible=shuffle(base);
    for(let n=0;n<10;n++){
      if(!eligible.length){
        used.clear();
        let refill=pool.filter(x=>(s===2||s===4)?isSafeContext(x):true);
        if(s===4){const hard=refill.filter(x=>x.difficulty>=2);if(hard.length>=10)refill=hard;}
        eligible=shuffle(refill);
      }
      const item=eligible.shift(); used.add(norm(item.word)); out.push({item,stage:s});
    }
  }
  return out;
}
