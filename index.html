<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vocabulary Rush: Boss Battle</title>
<style>
:root{--bg:#05080e;--panel:#0b1018ee;--line:#303642;--txt:#f5f7fb;--muted:#a9b1bd;--cyan:#4edcff;--red:#ef2436;--yellow:#ffc928;--good:#27d878}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% 10%,#25100b 0,#09090d 38%,#03050a 100%);color:var(--txt);font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;min-height:100vh}.wrap{max-width:1000px;margin:auto;padding:16px}.top{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #24303e;padding:7px 3px 13px}.logo{font-weight:950;font-size:21px}.logo b{color:var(--cyan)}.mini{color:#ddd;letter-spacing:2px}
.card{background:linear-gradient(180deg,#0d121bdc,#080b12ed);border:1px solid #2d333d;border-radius:20px;padding:22px;box-shadow:0 20px 70px #0009}.hidden{display:none!important}
.setup{max-width:650px;margin:50px auto}.setup h1{text-align:center;font-size:42px;margin:5px}.setup p{text-align:center;color:var(--muted)}.row{display:flex;gap:10px;flex-wrap:wrap}.pick{flex:1;min-width:180px}label{display:block;color:var(--muted);font-size:13px;margin:8px 0}select,input{width:100%;padding:13px;border-radius:11px;border:1px solid #303a48;background:#0b111b;color:white}.primary{width:100%;padding:15px;border:0;border-radius:12px;background:linear-gradient(90deg,#1ec9d2,#4aa9ff);font-weight:950;margin-top:18px;cursor:pointer}
.hud{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}.stat{background:#090e16;border:1px solid #252e3a;border-radius:12px;padding:9px;text-align:center}.stat small{display:block;color:var(--muted)}.stat strong{font-size:22px}.q{text-align:center;padding:22px 4px}.tag{color:var(--cyan);font-weight:900;font-size:12px}.q h2{font-size:clamp(29px,7vw,48px);margin:8px}.q p{color:var(--muted)}.answers{display:grid;grid-template-columns:1fr 1fr;gap:10px}.ans{min-height:72px;background:#101722;border:1px solid #343c48;border-radius:13px;color:white;font-weight:750;padding:11px;cursor:pointer}.ans.good{border-color:var(--good);background:#0d3827}.ans.bad{border-color:var(--red);background:#42131b}.feedback{text-align:center;min-height:30px;padding-top:10px;font-weight:900}
.battleTitle{text-align:center;margin:13px 0 4px;color:#ff303e;font-size:clamp(35px,8vw,66px);font-weight:1000;font-style:italic;text-shadow:0 0 22px #e3152566}.bossName{text-align:center;letter-spacing:4px;color:#ddd;margin-bottom:10px}.bossGrid{display:grid;grid-template-columns:190px 1fr 190px;gap:12px;align-items:center}.side{display:grid;gap:10px}.sideBox{background:#080b10d9;border:1px solid #362126;border-radius:15px;padding:13px;text-align:center}.sideBox small{display:block;color:#aaa}.sideBox strong{font-size:25px;color:var(--yellow)}.bossStage{text-align:center;position:relative}.bossImg{width:min(100%,420px);max-height:330px;object-fit:contain;border-radius:18px;filter:drop-shadow(0 0 30px #e82a2044)}.damage{position:absolute;left:50%;top:35%;transform:translate(-50%,-50%);font-size:48px;color:#ff3446;font-weight:1000;text-shadow:0 3px 8px #000;opacity:0;pointer-events:none}.damage.pop{animation:pop .55s}@keyframes pop{0%{opacity:1;transform:translate(-50%,-20%) scale(.6)}60%{opacity:1;transform:translate(-50%,-80%) scale(1.2)}100%{opacity:0;transform:translate(-50%,-120%) scale(1)}}.hit{animation:hit .35s}@keyframes hit{25%{transform:translateX(-12px);filter:brightness(1.7) sepia(1) saturate(5)}75%{transform:translateX(12px)}}
.hpText{display:flex;justify-content:space-between;font-weight:950;margin:8px 0 5px;color:#fff}.hpText b{color:#ff3242}.hpTrack{height:24px;border-radius:13px;background:#390c13;border:2px solid #72141e;overflow:hidden}.hp{height:100%;width:100%;background:linear-gradient(90deg,#a90013,#ed1d32,#ff4b58);transition:.35s}.timerTrack{height:7px;background:#15202b;border-radius:10px;overflow:hidden;margin:8px 0 2px}.timerFill{height:100%;width:100%;background:#4edcff;transition:width .08s linear}.bossQuestion{border:1px solid #8b151e;background:#090909e8;border-radius:17px;padding:16px;margin-top:12px}.bossQuestion .q{padding:4px}.phase{color:#ff4955!important}.enraged .battleTitle{animation:pulse .8s infinite}.enraged .bossImg{filter:drop-shadow(0 0 35px #ff1f2f) saturate(1.5)}@keyframes pulse{50%{text-shadow:0 0 45px #ff1428}}
.result{text-align:center;max-width:650px;margin:45px auto}.scoreBig{font-size:60px;font-weight:1000;color:var(--yellow)}.bonus{color:#ff5a66;font-weight:900}.actions button{padding:12px 22px;border:1px solid #333;background:#121923;color:white;border-radius:11px;cursor:pointer}
@media(max-width:760px){.bossGrid{grid-template-columns:1fr}.side{grid-template-columns:1fr 1fr}.bossImg{max-height:250px}.answers{grid-template-columns:1fr}.hud{grid-template-columns:repeat(2,1fr)}}
</style></head><body><div class="wrap"><div class="top"><div class="logo"><b>⚡</b> VOCABULARY RUSH</div><div class="mini">BOSS EDITION</div></div>
<section id="setup" class="card setup"><h1>VOCABULARY <span style="color:#4edcff">RUSH</span></h1><p>60초 러시를 통과하고 WORD DESTROYER를 쓰러뜨려라.</p><div class="row"><div class="pick"><label>PLAYER NAME</label><input id="name" maxlength="14" placeholder="닉네임"></div><div class="pick"><label>RANGE</label><select id="lesson"><option value="All">Lesson 3 + 4</option><option>Lesson 3</option><option>Lesson 4</option></select></div></div><button class="primary" onclick="startRush()">GAME START ⚡</button></section>
<section id="rush" class="card hidden"><div class="hud"><div class="stat"><small>TIME</small><strong id="time">60</strong></div><div class="stat"><small>SCORE</small><strong id="score">0</strong></div><div class="stat"><small>COMBO</small><strong id="combo">0</strong></div><div class="stat"><small>MISTAKES</small><strong id="mistakes">0</strong></div></div><div class="q"><span id="tag" class="tag"></span><h2 id="rushQ"></h2><p>알맞은 뜻을 고르세요.</p></div><div id="rushAnswers" class="answers"></div><div id="rushFeedback" class="feedback"></div></section>
<section id="boss" class="hidden"><div class="battleTitle">BOSS BATTLE</div><div class="bossName">WORD DESTROYER</div><div class="bossGrid"><div class="side"><div class="sideBox"><small>RUSH SCORE</small><strong id="rushScore"></strong></div><div class="sideBox"><small>BEST COMBO</small><strong id="bestCombo"></strong></div></div><div class="bossStage"><img id="bossImg" class="bossImg" src="boss.png" alt="Word Destroyer"><div id="damage" class="damage">-100</div><div class="hpText"><span>❤️ BOSS HP</span><span><b id="hpNum">1000</b> / 1000</span></div><div class="hpTrack"><div id="hp" class="hp"></div></div></div><div class="side"><div class="sideBox"><small>PHASE</small><strong id="phase">1</strong><small id="phaseMode" class="phase">영어 → 한국어</small></div><div class="sideBox"><small>LIVES</small><strong id="lives">❤️❤️❤️</strong></div><div class="sideBox"><small>QUESTION TIME</small><strong id="bossTime" style="color:#4edcff">8.0</strong><small>SEC</small></div></div></div><div class="bossQuestion"><div class="timerTrack"><div id="timerFill" class="timerFill"></div></div><div class="q"><span class="tag" id="bossTag"></span><h2 id="bossQ"></h2><p id="bossHint"></p></div><div id="bossAnswers" class="answers"></div><div id="bossFeedback" class="feedback"></div></div></section>
<section id="result" class="card result hidden"><div class="tag">MISSION COMPLETE</div><h1 id="resultTitle"></h1><div id="finalScore" class="scoreBig"></div><p id="stats"></p><p id="bonus" class="bonus"></p><div class="actions"><button onclick="location.reload()">다시 도전</button></div></section></div>
<script>
const WORDS=[{"lesson": "Lesson 3", "section": "Reading", "word": "statistical", "meaning": "통계적인"}, {"lesson": "Lesson 3", "section": "Reading", "word": "offensive", "meaning": "공격의"}, {"lesson": "Lesson 3", "section": "Reading", "word": "frequency", "meaning": "빈도"}, {"lesson": "Lesson 3", "section": "Reading", "word": "underrated", "meaning": "과소평가된"}, {"lesson": "Lesson 3", "section": "Reading", "word": "contribution", "meaning": "기여"}, {"lesson": "Lesson 3", "section": "Reading", "word": "budget", "meaning": "예산"}, {"lesson": "Lesson 3", "section": "Reading", "word": "prompt", "meaning": "자극하다"}, {"lesson": "Lesson 3", "section": "Reading", "word": "analytics", "meaning": "분석"}, {"lesson": "Lesson 3", "section": "Reading", "word": "undergo", "meaning": "(변화를) 겪다"}, {"lesson": "Lesson 3", "section": "Reading", "word": "prevailing", "meaning": "우세한"}, {"lesson": "Lesson 3", "section": "Reading", "word": "expertise", "meaning": "전문 지식"}, {"lesson": "Lesson 3", "section": "Reading", "word": "recruitment", "meaning": "(구성원) 모집"}, {"lesson": "Lesson 3", "section": "Reading", "word": "strategy", "meaning": "전략"}, {"lesson": "Lesson 3", "section": "Reading", "word": "vital sign", "meaning": "활력 징후"}, {"lesson": "Lesson 3", "section": "Reading", "word": "tactical", "meaning": "전략적인"}, {"lesson": "Lesson 3", "section": "Reading", "word": "substitution", "meaning": "교체"}, {"lesson": "Lesson 3", "section": "Reading", "word": "notable", "meaning": "주목할 만한"}, {"lesson": "Lesson 3", "section": "Reading", "word": "sweep", "meaning": "(빗자루 등으로) 쓸다"}, {"lesson": "Lesson 3", "section": "Reading", "word": "dominate", "meaning": "(스포츠 경기에서) 우세하다"}, {"lesson": "Lesson 3", "section": "Reading", "word": "edge", "meaning": "우위"}, {"lesson": "Lesson 3", "section": "Reading", "word": "advanced", "meaning": "선진의"}, {"lesson": "Lesson 3", "section": "Reading", "word": "convert", "meaning": "전환하다"}, {"lesson": "Lesson 3", "section": "Reading", "word": "stable", "meaning": "안정적인"}, {"lesson": "Lesson 3", "section": "Reading", "word": "chemistry", "meaning": "(사람들 사이의) 조화나 호흡"}, {"lesson": "Lesson 3", "section": "Reading", "word": "undeniably", "meaning": "명백하게"}, {"lesson": "Lesson 3", "section": "Reading", "word": "elevate", "meaning": "증가시키다"}, {"lesson": "Lesson 3", "section": "Further Reading", "word": "transfer", "meaning": "전환하다"}, {"lesson": "Lesson 3", "section": "Further Reading", "word": "overall", "meaning": "전체의"}, {"lesson": "Lesson 3", "section": "Further Reading", "word": "diameter", "meaning": "지름"}, {"lesson": "Lesson 3", "section": "Further Reading", "word": "thrilling", "meaning": "아주 신나는"}, {"lesson": "Lesson 4", "section": "Reading", "word": "remarkable", "meaning": "놀랄 만한"}, {"lesson": "Lesson 4", "section": "Reading", "word": "witness", "meaning": "목격하다"}, {"lesson": "Lesson 4", "section": "Reading", "word": "march", "meaning": "행진하다"}, {"lesson": "Lesson 4", "section": "Reading", "word": "memorial service", "meaning": "추도식"}, {"lesson": "Lesson 4", "section": "Reading", "word": "late", "meaning": "고인이 된"}, {"lesson": "Lesson 4", "section": "Reading", "word": "fortress", "meaning": "요새"}, {"lesson": "Lesson 4", "section": "Reading", "word": "self-sufficient", "meaning": "자급자족할 수 있는"}, {"lesson": "Lesson 4", "section": "Reading", "word": "architectural", "meaning": "건축술의"}, {"lesson": "Lesson 4", "section": "Reading", "word": "rush", "meaning": "쇄도"}, {"lesson": "Lesson 4", "section": "Reading", "word": "fancy", "meaning": "값비싼, 고급의"}, {"lesson": "Lesson 4", "section": "Reading", "word": "cherry on top", "meaning": "금상첨화"}, {"lesson": "Lesson 4", "section": "Reading", "word": "accessible", "meaning": "다가가기 쉬운, 접근 가능한"}, {"lesson": "Lesson 4", "section": "Reading", "word": "innovative", "meaning": "획기적인"}, {"lesson": "Lesson 4", "section": "Reading", "word": "diverse", "meaning": "다양한"}, {"lesson": "Lesson 4", "section": "Reading", "word": "document", "meaning": "기록하다"}, {"lesson": "Lesson 4", "section": "Reading", "word": "heritage", "meaning": "(국가, 사회 등의) 유산"}, {"lesson": "Lesson 4", "section": "Reading", "word": "authentic", "meaning": "진짜와 꼭 같게 만든, 진본인"}, {"lesson": "Lesson 4", "section": "Reading", "word": "translate", "meaning": "번역하다"}, {"lesson": "Lesson 4", "section": "Reading", "word": "restore", "meaning": "복원하다"}, {"lesson": "Lesson 4", "section": "Reading", "word": "significant", "meaning": "중요한"}, {"lesson": "Lesson 4", "section": "Further Reading", "word": "defense", "meaning": "방어 시설"}, {"lesson": "Lesson 4", "section": "Further Reading", "word": "scarce", "meaning": "부족한"}, {"lesson": "Lesson 4", "section": "Further Reading", "word": "surround", "meaning": "둘러싸다"}, {"lesson": "Lesson 4", "section": "Further Reading", "word": "withdraw", "meaning": "물러나다"}], $=x=>document.getElementById(x), shuffle=a=>[...a].sort(()=>Math.random()-.5);
let pool=[],cur,lastWord="",score=0,combo=0,best=0,left=60,timer,wrong=[],correct=0,total=0,locked=false;
let bossHP=1000,lives=3,bcombo=0,bq=0,bossCorrect=0,bossTimer=null,bossDeadline=0,bossLimit=8;
function uniqueWrong(){return [...new Map(wrong.map(x=>[x.word,x])).values()]}
function chooseItemBoss(){let w=uniqueWrong(), useWrong=w.length&&Math.random()<.35;let source=useWrong?w:pool;let choices=source.filter(x=>x.word!==lastWord);if(!choices.length)choices=pool.filter(x=>x.word!==lastWord);let item=choices[Math.floor(Math.random()*choices.length)]||pool[0];lastWord=item.word;return item}
function options(item,reverse){let ans=reverse?item.word:item.meaning;let others=pool.filter(x=>x.word!==item.word).map(x=>reverse?x.word:x.meaning);return shuffle([ans,...shuffle([...new Set(others)]).slice(0,3)])}
function render(id,opts,ans,fn){$(id).innerHTML="";opts.forEach(v=>{let b=document.createElement("button");b.className="ans";b.textContent=v;b.onclick=()=>fn(b,v,ans);$(id).appendChild(b)})}
function mark(id,btn,v,ans){[...$(id).children].forEach(b=>{b.disabled=true;if(b.textContent===ans)b.classList.add("good")});if(v!==ans)btn.classList.add("bad")}
function startRush(){pool=WORDS.filter(x=>$("lesson").value==="All"||x.lesson===$("lesson").value);$("setup").classList.add("hidden");$("rush").classList.remove("hidden");rushNext();timer=setInterval(()=>{left--;$("time").textContent=left;if(left<=0){clearInterval(timer);startBoss()}},1000)}
function rushNext(){locked=false;cur=pool[Math.floor(Math.random()*pool.length)];$("tag").textContent=cur.lesson+" · "+cur.section;$("rushQ").textContent=cur.word;$("rushFeedback").textContent="";render("rushAnswers",options(cur,false),cur.meaning,rushChoose)}
function rushChoose(btn,v,ans){if(locked)return;locked=true;total++;mark("rushAnswers",btn,v,ans);if(v===ans){correct++;combo++;best=Math.max(best,combo);let pts=100+Math.min(combo-1,10)*10;score+=pts;$("rushFeedback").textContent="정답! +"+pts}else{combo=0;wrong.push(cur);$("rushFeedback").textContent="정답: "+ans}$("score").textContent=score;$("combo").textContent=combo;$("mistakes").textContent=wrong.length;setTimeout(()=>{if(left>0)rushNext()},430)}
function startBoss(){$("rush").classList.add("hidden");$("boss").classList.remove("hidden");$("rushScore").textContent=score;$("bestCombo").textContent=best;bossNext()}
function phaseInfo(){if(bossHP>700)return {p:1,rev:false,label:"영어 → 한국어"};if(bossHP>300)return {p:2,rev:true,label:"한국어 → 영어"};return {p:3,rev:Math.random()<.5,label:"ENRAGED · MIX"}}
function bossNext(){if(bossHP<=0||lives<=0)return finish();clearInterval(bossTimer);locked=false;bq++;cur=chooseItemBoss();let ph=phaseInfo();bossLimit=ph.p===1?8:ph.p===2?6:4;$("phase").textContent=ph.p;$("phaseMode").textContent=ph.label;$("boss").classList.toggle("enraged",ph.p===3);$("bossTag").textContent="BOSS Q "+bq+(uniqueWrong().some(x=>x.word===cur.word)?" · REVENGE WORD":"");$("bossQ").textContent=ph.rev?cur.meaning:cur.word;$("bossHint").textContent=ph.rev?"알맞은 영어 표현을 고르세요.":"알맞은 뜻을 고르세요.";$("bossFeedback").textContent="";render("bossAnswers",options(cur,ph.rev),ph.rev?cur.word:cur.meaning,bossChoose);bossDeadline=performance.now()+bossLimit*1000;tickBoss();bossTimer=setInterval(tickBoss,80)}
function tickBoss(){let remain=Math.max(0,(bossDeadline-performance.now())/1000);$("bossTime").textContent=remain.toFixed(1);$("timerFill").style.width=(remain/bossLimit*100)+"%";if(remain<=0){clearInterval(bossTimer);bossTimeout()}}
function bossTimeout(){if(locked)return;locked=true;bcombo=0;lives--;$("lives").textContent="❤️".repeat(lives)+(lives===0?"💀":"");$("bossFeedback").textContent="⏰ TIME OUT! ❤️ -1";[...$("bossAnswers").children].forEach(b=>b.disabled=true);setTimeout(()=>{if(lives<=0)finish();else bossNext()},700)}
function bossChoose(btn,v,ans){if(locked)return;locked=true;clearInterval(bossTimer);mark("bossAnswers",btn,v,ans);if(v===ans){bossCorrect++;bcombo++;let dmg=bcombo>=5?200:bcombo>=3?150:100;bossHP=Math.max(0,bossHP-dmg);score+=dmg;$("bossFeedback").textContent=(dmg===200?"🔥 CRITICAL! ":"💥 HIT! ")+"-"+dmg+" HP";let d=$("damage");d.textContent="-"+dmg;d.classList.remove("pop");void d.offsetWidth;d.classList.add("pop");$("bossImg").classList.add("hit");setTimeout(()=>$("bossImg").classList.remove("hit"),350)}else{bcombo=0;lives--;$("bossFeedback").textContent="💔 반격! 정답: "+ans}$("hpNum").textContent=bossHP;$("hp").style.width=(bossHP/10)+"%";$("lives").textContent="❤️".repeat(lives)+(lives===0?"💀":"");setTimeout(()=>{if(bossHP<=0||lives<=0)finish();else bossNext()},650)}
function finish(){clearInterval(bossTimer);$("boss").classList.add("hidden");$("result").classList.remove("hidden");let win=bossHP<=0,bonus=win?1000:0;score+=bonus;$("resultTitle").textContent=win?"🏆 BOSS DEFEATED!":"💀 BOSS SURVIVED";$("finalScore").textContent=score+" PTS";let acc=total?Math.round(correct/total*100):0,damage=1000-bossHP;$("stats").textContent=`${$("name").value||"PLAYER"} · Rush 정답률 ${acc}% · Boss 정답 ${bossCorrect} · 보스 피해 ${damage}/1000 · 남은 HP ${bossHP}`;$("bonus").textContent=win?"🏆 CLEAR · BOSS CLEAR BONUS +1,000":`FAILED · HP ${bossHP} 남음 · 획득 점수는 그대로 인정됩니다.`}
</script></body></html>
